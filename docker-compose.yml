services:
  app:
    image: node:22-alpine
    container_name: site-vitrine2
    working_dir: /app

    ports:
      - "3000:3000"

    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next

    environment:
      NODE_ENV: development

    command: sh -c "npm install && npm run dev -- -H 0.0.0.0"

    restart: unless-stopped

volumes:
  node_modules:
  next_cache: